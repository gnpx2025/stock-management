<app-global-loader />

<div class="shell d-flex flex-column h-100" [class.shell--nav-open]="navOpen()">
  <app-shell-topbar
    class="z-index-1"
    [navOpen]="navOpen()"
    (navToggle)="toggleNav()"
  />
  <div class="shell__main d-flex flex-grow-1">
    <button
      type="button"
      class="shell__nav-backdrop"
      [attr.aria-hidden]="navOpen() ? null : 'true'"
      [attr.tabindex]="navOpen() ? 0 : -1"
      [attr.aria-label]="'shell.sidebar.closeNav' | erpTranslate: 'Close navigation'"
      (click)="closeNav()"
    ></button>
    <app-shell-sidebar
      class="shell__sidebar flex-shrink-0 h-100"
      (navigated)="closeNav()"
    />
    <main class="shell__body flex-grow-1 p-6 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
