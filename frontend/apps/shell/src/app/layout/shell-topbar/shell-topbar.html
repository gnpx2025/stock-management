<header
  class="shell-topbar d-flex align-items-center justify-content-between gap-3 px-3"
  role="banner"
>
  <div class="shell-topbar__brand d-flex flex-shrink-0 align-items-center gap-2">
    <span class="shell-topbar__menu">
      <erp-button
        variant="icon"
        type="button"
        icon="menu"
        [ariaLabel]="navToggleLabel()"
        (clicked)="navToggle.emit()"
      />
    </span>

    <span
      class="shell-topbar__mark d-inline-grid place-items-center flex-shrink-0 text-accent fw-700"
      aria-hidden="true"
      >ERP</span
    >
    <span class="shell-topbar__title overflow-hidden fw-600 text-accent">{{
      'shell.topbar.brandTitle' | erpTranslate: 'ERP Platform'
    }}</span>
  </div>

  <div class="shell-topbar__trailing d-flex align-items-center min-w-0 gap-4">
    <erp-search-input
      class="shell-topbar__search min-w-0 align-self-center"
      [placeholder]="'shell.topbar.searchPlaceholder' | erpTranslate: 'Search'"
      [ariaLabel]="'shell.topbar.searchAria' | erpTranslate: 'Search'"
      [options]="searchOptions()"
    />

    <div class="shell-topbar__actions d-flex align-items-center gap-2 flex-shrink-0">
      <erp-button
        variant="icon"
        type="button"
        icon="notifications"
        [ariaLabel]="'shell.topbar.notifications' | erpTranslate: 'Notifications'"
        (clicked)="onNotificationClick()"
      />

      <erp-button
        variant="icon"
        type="button"
        [icon]="themeToggleIcon()"
        [ariaLabel]="themeToggleLabel()"
        (clicked)="toggleTheme()"
      />

      <erp-language-selector
        [language]="language.language()"
        [ariaLabel]="languageAriaLabel()"
        (languageChange)="onLanguageChange($event)"
      />

      <erp-menu
        triggerClass="shell-topbar__profile d-inline-flex align-items-center justify-content-center p-0"
        [ariaLabel]="accountMenuLabel()"
        [items]="profileMenuItems()"
        xPosition="before"
        (itemSelected)="onProfileMenuItem($event)"
      >
        <span class="shell-topbar__profile-initial" aria-hidden="true">{{
          displayInitial()
        }}</span>
      </erp-menu>
    </div>
  </div>
</header>
