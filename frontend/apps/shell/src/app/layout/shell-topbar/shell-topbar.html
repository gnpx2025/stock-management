<header
  class="shell-topbar d-flex align-items-center justify-content-between gap-4 px-4"
  role="banner"
>
  <div class="shell-topbar__brand d-flex flex-shrink-0 align-items-center gap-3">
    <span
      class="shell-topbar__mark d-inline-grid place-items-center flex-shrink-0 text-accent fw-700"
      aria-hidden="true"
      >ERP</span
    >
    <span class="shell-topbar__title overflow-hidden fw-600">{{
      'shell.topbar.brandTitle' | erpTranslate: 'ERP Platform'
    }}</span>
  </div>

  <erp-search-input
    class="shell-topbar__search flex-grow-1"
    [placeholder]="'shell.topbar.searchPlaceholder' | erpTranslate: 'Search'"
    [ariaLabel]="'shell.topbar.searchAria' | erpTranslate: 'Search'"
    [options]="searchOptions()"
  />

  <div class="shell-topbar__actions d-flex align-items-center gap-1 flex-shrink-0">
    <erp-button
      variant="icon"
      type="button"
      icon="notifications"
      [ariaLabel]="'shell.topbar.notifications' | erpTranslate: 'Notifications'"
      (clicked)="onNotificationClick()"
    />

    <erp-button
      variant="icon"
      type="button"
      [icon]="themeToggleIcon()"
      [ariaLabel]="themeToggleLabel()"
      (clicked)="toggleTheme()"
    />

    <erp-language-selector
      [language]="language.language()"
      [ariaLabel]="languageAriaLabel()"
      (languageChange)="onLanguageChange($event)"
    />

    <button
      matButton="outlined"
      type="button"
      class="shell-topbar__profile"
      [matMenuTriggerFor]="profileMenu"
      [attr.aria-label]="accountMenuLabel()"
    >
      <span class="shell-topbar__profile-name">{{ displayName() }}</span>
      <erp-icon name="arrow_drop_down" />
    </button>

    <mat-menu #profileMenu="matMenu" xPosition="before">
      <button mat-menu-item type="button" (click)="logout()">
        {{ 'shell.topbar.logout' | erpTranslate: 'Logout' }}
      </button>
    </mat-menu>
  </div>
</header>
