<p-toast position="top-right" />
<app-global-loader />

<div class="shell">
  <header class="shell__header">
    <div class="shell__brand">
      <span class="shell__mark">ERP</span>
      <div>
        <p class="shell__product">Platform Shell</p>
        <p class="shell__env">Foundation</p>
      </div>
    </div>
    <div class="shell__actions">
      <p-button
        [label]="theme.currentMode() === 'dark' ? 'Light mode' : 'Dark mode'"
        [outlined]="true"
        severity="secondary"
        size="small"
        (onClick)="toggleTheme()"
      />
      <p-button
        label="Logout"
        [outlined]="true"
        severity="secondary"
        size="small"
        (onClick)="logout()"
      />
    </div>
  </header>

  <aside class="shell__sidebar">
    <nav>
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Foundation home
      </a>
    </nav>
  </aside>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
