<button
  matButton="outlined"
  type="button"
  class="erp-language-selector"
  [matMenuTriggerFor]="languageMenu"
  [attr.aria-label]="ariaLabel()"
>
  <span class="erp-language-selector__value">{{ activeOption().display }}</span>
  <erp-icon name="arrow_drop_down" />
</button>

<mat-menu #languageMenu="matMenu" xPosition="before">
  @for (option of options(); track option.id) {
    <button
      mat-menu-item
      type="button"
      [attr.aria-current]="option.id === language() ? 'true' : null"
      (click)="select(option.id)"
    >
      {{ option.display }}
    </button>
  }
</mat-menu>
