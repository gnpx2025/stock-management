<erp-menu
  triggerAppearance="outlined"
  triggerClass="erp-language-selector min-w-0 px-2"
  [ariaLabel]="ariaLabel()"
  [items]="menuItems()"
  xPosition="before"
  (itemSelected)="onItemSelected($event)"
>
  <span class="erp-language-selector__value fw-600">{{ activeOption().display }}</span>
  <erp-icon name="arrow_drop_down" />
</erp-menu>
