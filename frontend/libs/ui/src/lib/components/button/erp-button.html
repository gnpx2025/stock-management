@switch (variant()) {
  @case ('icon') {
    <button
      mat-icon-button
      [attr.type]="type()"
      [disabled]="disabled() || loading()"
      [attr.aria-label]="ariaLabel()"
      (click)="clicked.emit($event)"
    >
      @if (loading()) {
        <erp-spinner [diameter]="spinnerDiameter()" />
      } @else if (icon()) {
        <erp-icon [name]="icon()!" />
      }
      <ng-content />
    </button>
  }
  @case ('stroked') {
    <button
      mat-stroked-button
      [color]="color()"
      [attr.type]="type()"
      [disabled]="disabled() || loading()"
      [attr.aria-label]="ariaLabel()"
      (click)="clicked.emit($event)"
    >
      @if (loading()) {
        <erp-spinner [diameter]="spinnerDiameter()" />
      } @else if (icon()) {
        <erp-icon [name]="icon()!" />
      }
      <ng-content />
    </button>
  }
  @case ('basic') {
    <button
      mat-button
      [color]="color()"
      [attr.type]="type()"
      [disabled]="disabled() || loading()"
      [attr.aria-label]="ariaLabel()"
      (click)="clicked.emit($event)"
    >
      @if (loading()) {
        <erp-spinner [diameter]="spinnerDiameter()" />
      } @else if (icon()) {
        <erp-icon [name]="icon()!" />
      }
      <ng-content />
    </button>
  }
  @default {
    <button
      mat-flat-button
      [color]="color()"
      [attr.type]="type()"
      [disabled]="disabled() || loading()"
      [attr.aria-label]="ariaLabel()"
      (click)="clicked.emit($event)"
    >
      @if (loading()) {
        <erp-spinner [diameter]="spinnerDiameter()" />
      } @else if (icon()) {
        <erp-icon [name]="icon()!" />
      }
      <ng-content />
    </button>
  }
}
