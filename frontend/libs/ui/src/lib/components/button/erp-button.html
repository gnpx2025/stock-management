<ng-template #projected>
  <ng-content />
</ng-template>

@if (variant() === 'icon') {
  <button
    mat-icon-button
    class="d-inline-flex align-items-center justify-content-center gap-2"
    [color]="color()"
    [attr.type]="type()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="ariaLabel()"
    (click)="clicked.emit($event)"
  >
    @if (loading()) {
      <erp-spinner [diameter]="spinnerDiameter()" />
    } @else if (icon()) {
      <erp-icon [name]="icon()!" [outlined]="iconOutlined()" />
    }
    <ng-container [ngTemplateOutlet]="projected" />
  </button>
} @else {
  <button
    [matButton]="appearance()"
    class="d-inline-flex align-items-center justify-content-center gap-2"
    [color]="color()"
    [attr.type]="type()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="ariaLabel()"
    (click)="clicked.emit($event)"
  >
    @if (loading()) {
      <erp-spinner [diameter]="spinnerDiameter()" />
    } @else if (icon()) {
      <erp-icon [name]="icon()!" [outlined]="iconOutlined()" />
    }
    <ng-container [ngTemplateOutlet]="projected" />
  </button>
}
