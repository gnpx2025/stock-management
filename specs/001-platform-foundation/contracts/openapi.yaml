openapi: 3.0.3
info:
  title: ERP Platform Foundation API
  version: 1.0.0
  description: >
    Foundation-only contracts. No authentication or business resources.
servers:
  - url: http://localhost:5080
    description: Local API (port may vary; see quickstart)
paths:
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Aggregate platform health for Shell connectivity
      tags: [Platform]
      parameters:
        - name: X-Correlation-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Health payload (may be Healthy or Degraded)
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Platform unhealthy (typically database unavailable)
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health:
    get:
      operationId: getOpsHealth
      summary: Ops health probe including dependency checks
      tags: [Ops]
      responses:
        '200':
          description: Healthy
        '503':
          description: Unhealthy
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness (no database required)
      tags: [Ops]
      responses:
        '200':
          description: Alive
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness including database connectivity
      tags: [Ops]
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
components:
  schemas:
    HealthStatusEnum:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    ComponentHealth:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        description:
          type: string
    HealthStatus:
      type: object
      required: [status, checkedAtUtc, api, database]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checkedAtUtc:
          type: string
          format: date-time
        api:
          $ref: '#/components/schemas/ComponentHealth'
        database:
          $ref: '#/components/schemas/ComponentHealth'
        correlationId:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
