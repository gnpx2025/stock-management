name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:ui-libs
      - run: npx nx run-many -t lint,test,build --projects=shell,core,ui,i18n,shared,contracts --skip-nx-cache

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=erp;Username=erp;Password=erp_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ERP.sln
      - run: dotnet build ERP.sln --no-restore --configuration Release
      - run: dotnet tool install --global dotnet-ef --version 10.*
      - run: dotnet ef database update --project src/ERP.Infrastructure --startup-project src/ERP.Api
      - run: dotnet test ERP.sln --no-build --configuration Release --verbosity normal
